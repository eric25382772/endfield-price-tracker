{% extends "base.html" %}
{% block content %}
<div class="ef-htitle">
    <h3>價格預測</h3>
    <div class="ef-segbar"><i></i><i></i><i></i></div>
</div>
<p class="text-muted mb-2"><span class="ef-label">FORECAST</span> · 以每物品同星期幾歷史中位數為基準，套全區漲跌修正 · 今日 <span class="ef-label" id="today-text">…</span></p>

<div class="ef-rtabs" id="region-tabs">
    <div class="ef-rtab on" data-region="valley_iv">四號谷地</div>
    <div class="ef-rtab" data-region="wuling">武陵</div>
</div>

<div class="ef-selector-wrap">
    <button type="button" class="ef-arrow ef-arrow-l" aria-label="上一個">&#8249;</button>
    <div class="ef-selector" id="selector"></div>
    <button type="button" class="ef-arrow ef-arrow-r" aria-label="下一個">&#8250;</button>
</div>
<div id="focus-area"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
    const REGION_COLOR = { valley_iv: '#E5C100', wuling: '#5FB78A' };
    let region = 'valley_iv', items = [], selected = 0, chart = null;

    const $sel = document.getElementById('selector');
    const $focus = document.getElementById('focus-area');
    function color() { return REGION_COLOR[region]; }

    function chip(item, i) {
        const on = i === selected ? 'on' : '';
        const style = i === selected ? `style="border-color:${color()}"` : '';
        const bar = i === selected ? `<span style="position:absolute;left:0;top:0;width:5px;height:100%;background:${color()}"></span>` : '';
        return `<div class="ef-ichip ${on}" data-i="${i}" ${style}>${bar}
            <div class="ic"><img src="/item_image/${item.item_id}" alt=""
                 onerror="this.outerHTML='<span class=&quot;ph&quot;>#${item.item_id}</span>'"></div>
            <div class="nm">${item.name_cn}</div>
            <div class="id" ${i===selected?`style="color:${color()}"`:''}>#${item.item_id}</div>
        </div>`;
    }

    function renderSelector() {
        $sel.innerHTML = items.map(chip).join('');
        $sel.querySelectorAll('.ef-ichip').forEach(el => {
            el.addEventListener('click', () => { selected = +el.dataset.i; renderSelector(); renderFocus(); });
        });
    }

    function stat(k, v, cls) { return `<div class="ef-srow"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`; }

    function renderFocus() {
        const it = items[selected];
        if (!it) { $focus.innerHTML = ''; return; }
        const myF = it.my_forecast, frF = it.friend_forecast;
        const myLast = myF.predictions.length ? myF.predictions[myF.predictions.length - 1].predicted : '—';
        const frLast = frF.predictions.length ? frF.predictions[frF.predictions.length - 1].predicted : '—';
        const myConf = (myF.confidence * 100).toFixed(0) + '%';
        const frConf = (frF.confidence * 100).toFixed(0) + '%';
        const insuf = myF.data_insufficient || frF.data_insufficient;
        const badge = insuf
            ? `<div class="ef-fbadge warn">⚠ 資料不足，僅供參考</div>`
            : `<div class="ef-fbadge" style="background:${color()}">預測信心足夠</div>`;
        $focus.innerHTML = `
        <div class="ef-focus">
            <div class="ef-panel chart"><span style="position:absolute;top:0;left:0;width:44px;height:4px;background:${color()}"></span>
                <div class="ef-chart-head"><span class="big">${it.name_cn}</span>
                    <span class="id" style="color:${color()}">#${it.item_id} · ${it.name_en || ''}</span></div>
                <div class="ef-chartbox"><canvas id="fc"></canvas></div>
            </div>
            <div class="ef-panel ef-stats">
                <div class="top" style="border-bottom-color:${color()}"><div class="nm">${it.name_cn}</div>
                    <div class="en">${(region==='valley_iv'?'VALLEY':'WULING')} · #${it.item_id}</div></div>
                ${stat('第 7 天 我的預測', myLast)}
                ${stat('我的信心', myConf, 'mut')}
                ${stat('第 7 天 好友預測', frLast, 'y')}
                ${stat('好友信心', frConf, 'mut')}
                ${badge}
            </div>
        </div>`;
        drawChart(it);
    }

    function drawChart(item) {
        if (chart) chart.destroy();
        const myP = item.my_forecast.predictions, frP = item.friend_forecast.predictions;
        const dates = Array.from(new Set([...myP.map(p => p.date), ...frP.map(p => p.date)])).sort();
        const myMap = Object.fromEntries(myP.map(p => [p.date, p.predicted]));
        const frMap = Object.fromEntries(frP.map(p => [p.date, p.predicted]));
        chart = new Chart(document.getElementById('fc'), {
            type: 'line',
            data: { labels: dates.map(d => d.slice(5)), datasets: [
                { label: '我的市場價（預測）', data: dates.map(d => myMap[d] ?? null), borderColor: color(),
                  backgroundColor: color() + '22', borderDash: [6, 4], fill: true, spanGaps: true, tension: .25, pointRadius: 3 },
                { label: '好友最高價（預測）', data: dates.map(d => frMap[d] ?? null), borderColor: '#D9D9D9',
                  backgroundColor: 'rgba(217,217,217,.05)', borderDash: [6, 4], spanGaps: true, tension: .25, pointRadius: 3 },
            ]},
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { boxWidth: 14, font: { size: 14 }, color: '#9a9a92' } },
                    tooltip: { callbacks: { title: items => items[0] && dates[items[0].dataIndex] } } },
                scales: { y: { grid: { color: '#2a2a2a' }, ticks: { color: '#828282', font: { size: 13 } } },
                          x: { grid: { color: '#222' }, ticks: { color: '#828282', font: { size: 13 }, autoSkip: true, maxTicksLimit: 10 } } } }
        });
    }

    async function load() {
        $sel.innerHTML = '';
        $focus.innerHTML = '<div class="ef-empty">載入中…</div>';
        if (chart) { chart.destroy(); chart = null; }
        let data;
        try {
            data = await (await fetch(`/api/forecast-data?region=${region}`)).json();
        } catch (e) { $focus.innerHTML = `<div class="ef-empty">載入失敗：${e}</div>`; return; }
        if (!data.ok || !data.items.length) { $focus.innerHTML = '<div class="ef-empty">此地區尚無資料</div>'; return; }
        document.getElementById('today-text').textContent = data.today;
        items = data.items; selected = 0;
        renderSelector(); renderFocus();
    }

    document.querySelectorAll('#region-tabs .ef-rtab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('#region-tabs .ef-rtab').forEach(x => x.classList.remove('on'));
            t.classList.add('on'); region = t.dataset.region; load();
        });
    });

    load();
})();
</script>
{% endblock %}
